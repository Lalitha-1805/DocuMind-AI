<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - HR Smart Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <header class="app-header" id="app-header"></header>

    <main class="container">
        <div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 class="text-gradient">Settings & Configuration</h1>
                <p>Manage API keys and Retrieval Augmented Generation (RAG) parameters.</p>
            </div>
            <a href="/dashboard" class="btn btn-secondary">← Back</a>
        </div>

        <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
            <form id="settingsForm">

                <div class="form-group">
                    <label for="groqKey">Groq API Key (required for LLM)</label>
                    <input type="password" id="groqKey" class="form-control" placeholder="gsk_...">
                    <small style="color: var(--text-muted); display: block; margin-top: 4px;">Stored locally securely in
                        your browser.</small>
                </div>

                <div class="form-group mt-4">
                    <label for="retrievalDepth">Retrieval Depth (chunks)</label>
                    <input type="range" id="retrievalDepth" min="1" max="5" step="1"
                        style="width: 100%; margin: 10px 0;">
                    <div
                        style="display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.875rem;">
                        <span>1 (Fast)</span>
                        <span id="depthVal" style="font-weight: bold; color: var(--primary-color);">3</span>
                        <span>5 (Detailed)</span>
                    </div>
                </div>

                <div class="form-group mt-4">
                    <label for="threshold">Distance Threshold (simulated confidence)</label>
                    <input type="range" id="threshold" min="0.5" max="1.5" step="0.1"
                        style="width: 100%; margin: 10px 0;">
                    <div
                        style="display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.875rem;">
                        <span>0.5 (Strict)</span>
                        <span id="threshVal" style="font-weight: bold; color: var(--primary-color);">1.0</span>
                        <span>1.5 (Loose)</span>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 2rem 0;">

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <button type="button" class="btn btn-danger" onclick="clearSettings()">Reset Defaults</button>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </div>

                <div id="saveMsg" class="hidden text-center mt-3"
                    style="color: var(--secondary-color); font-weight: 500;">Settings saved successfully!</div>
            </form>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.requireAuth();

            const depthInput = document.getElementById('retrievalDepth');
            const depthVal = document.getElementById('depthVal');
            const threshInput = document.getElementById('threshold');
            const threshVal = document.getElementById('threshVal');
            const keyInput = document.getElementById('groqKey');

            // Load existing
            const saved = JSON.parse(localStorage.getItem('hr_settings') || '{}');
            if (saved.groq_key) keyInput.value = saved.groq_key;
            depthInput.value = saved.depth || 3;
            threshInput.value = saved.threshold || 1.0;

            depthVal.textContent = depthInput.value;
            threshVal.textContent = threshInput.value;

            depthInput.addEventListener('input', (e) => depthVal.textContent = e.target.value);
            threshInput.addEventListener('input', (e) => threshVal.textContent = parseFloat(e.target.value).toFixed(1));

            document.getElementById('settingsForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const settings = {
                    groq_key: keyInput.value,
                    depth: parseInt(depthInput.value),
                    threshold: parseFloat(threshInput.value)
                };

                localStorage.setItem('hr_settings', JSON.stringify(settings));

                const msg = document.getElementById('saveMsg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 2000);
            });
        });

        function clearSettings() {
            if (confirm('Are you sure you want to clear API Keys and preferences?')) {
                localStorage.removeItem('hr_settings');
                window.location.reload();
            }
        }
    </script>
</body>

</html>
